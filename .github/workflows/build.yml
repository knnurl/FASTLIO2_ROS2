name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/FASTLIO2_ROS2
      - name: Build and run unit tests
        run: bash src/FASTLIO2_ROS2/.github/ci/build_and_test.sh
        env:
          WS: ${{ github.workspace }}
          JOBS: 4
